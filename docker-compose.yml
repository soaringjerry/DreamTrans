# DreamTrans Docker Compose
#
# Quick Start:
#   1. Copy .env.example to .env: cp backend/.env.example .env
#   2. Fill in your API keys in .env
#   3. Run: docker compose up -d
#
# For one-click install, use:
#   curl -fsSL https://raw.githubusercontent.com/soaringjerry/DreamTrans/main/scripts/install.sh | bash
#
version: '3.8'

services:
  # PostgreSQL Database (required for Pro features)
  postgres:
    image: postgres:16-alpine
    container_name: dreamtrans-db
    environment:
      POSTGRES_DB: dreamtrans
      POSTGRES_USER: ${POSTGRES_USER:-dreamtrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dreamtrans_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreamtrans} -d dreamtrans"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DreamTrans Application
  dreamtrans:
    image: ghcr.io/soaringjerry/dreamtrans:${IMAGE_TAG:-latest}
    container_name: dreamtrans
    ports:
      - "${PORT:-16002}:8080"
    environment:
      # Required: Speechmatics API Key
      - SM_API_KEY=${SM_API_KEY}
      # Optional: OpenAI API (for translation/chat)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE=${OPENAI_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # PostgreSQL (enables Pro features)
      - DATABASE_URL=postgres://${POSTGRES_USER:-dreamtrans}:${POSTGRES_PASSWORD:-dreamtrans_secret}@postgres:5432/dreamtrans?sslmode=disable
      # JWT Authentication
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production_32chars!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      # System Settings
      - ALLOW_USER_API_KEY=${ALLOW_USER_API_KEY:-false}
    volumes:
      - dreamtrans_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dreamtrans_data:
  postgres_data:

