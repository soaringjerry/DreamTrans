name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker-build.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'frontend/**'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/cmd/web/**'
      - 'backend/internal/**'
      - 'backend/migrations/**'
      - 'scripts/migrate.sh'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Use lowercase image name to satisfy GHCR naming requirements
  IMAGE_NAME: ${{ github.repository_owner }}/dreamtrans

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build metadata
        run: |
          echo "BUILD_TIME=$(date -u +%FT%TZ)" >> $GITHUB_ENV

      - name: Set up QEMU
        # setup-qemu-action v3, pinned to an immutable commit.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GHCR (retry)
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@v2
        with:
          max_attempts: 5
          retry_wait_seconds: 10
          timeout_minutes: 2
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=dreamtrans-app
            type=gha
          cache-to: type=gha,mode=max,scope=dreamtrans-app
          platforms: linux/amd64,linux/arm64
          build-args: |
            VCS_REF=${{ github.sha }}
            VITE_APP_COMMIT=${{ github.sha }}
            VITE_APP_BUILD_TIME=${{ env.BUILD_TIME }}
          
      - name: Generate deployment instructions
        if: github.event_name != 'pull_request'
        run: |
          echo "## Deployment Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Docker image has been built and pushed to GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run the container:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name dreamtrans \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 127.0.0.1:8080:8080 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e SM_API_KEY=your_speechmatics_api_key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e ALLOW_ANONYMOUS_API=true \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This anonymous compatibility example is local-only. Use the PostgreSQL-backed Compose deployment with JWT login for network access." >> $GITHUB_STEP_SUMMARY
