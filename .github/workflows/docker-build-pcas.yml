name: Build and Push Provider (gRPC) Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker-build-pcas.yml'
      - '.dockerignore'
      - 'backend/Dockerfile.pcas'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/cmd/pcas-provider/**'
      - 'backend/internal/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dreamtrans

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        # setup-qemu-action v3, pinned to an immutable commit.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (retry)
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@v2
        with:
          max_attempts: 5
          retry_wait_seconds: 10
          timeout_minutes: 2
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-provider
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (MODE=provider)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.pcas
          build-args: |
            MODE=provider
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=dreamtrans-provider
            type=gha
          cache-to: type=gha,mode=max,scope=dreamtrans-provider
          platforms: linux/amd64,linux/arm64

      - name: Generate deployment instructions
        if: github.event_name != 'pull_request'
        run: |
          echo "## Provider (gRPC) Deployment Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Provider Docker image has been built and pushed to GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-provider:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run the container (remote bind requires authentication and TLS):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name dreamtrans-provider \\" >> $GITHUB_STEP_SUMMARY
          echo "  -p 50052:50052 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e SM_API_KEY=your_speechmatics_api_key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e GRPC_BIND_ADDR=0.0.0.0 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_API_KEY=your_independent_pcas_service_key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_TLS_CERT=/run/secrets/tls.crt \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_TLS_KEY=/run/secrets/tls.key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /host/path/tls.crt:/run/secrets/tls.crt:ro \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /host/path/tls.key:/run/secrets/tls.key:ro \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-provider:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
