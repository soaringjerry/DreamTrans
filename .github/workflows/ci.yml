name: CI - Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Frontend CI ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Inject build metadata (frontend)
        run: |
          echo "VITE_APP_COMMIT=${GITHUB_SHA}" >> .env.production
          echo "VITE_APP_BUILD_TIME=$(date -u +%FT%TZ)" >> .env.production
        working-directory: ./frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Type check frontend
        run: npm run type-check
        working-directory: ./frontend

      - name: Check frontend build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BACKEND_URL: /
          VITE_BACKEND_WS_URL: /

      - name: Verify frontend core lifecycles
        run: npm run verify:core
        working-directory: ./frontend

      - name: Verify long-session frontend performance
        run: npm run verify:long-session
        working-directory: ./frontend

      # ---- Backend CI ----
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Check backend formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: ./backend

      - name: Check and download Go modules
        run: |
          go mod tidy -diff
          go mod download
          go mod verify
        working-directory: ./backend

      - name: Lint backend with golangci-lint-action
        # v9.3.0, pinned to the immutable release commit.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m --build-tags=event_worker
          skip-cache: true  # Skip cache to ensure fresh install

      - name: Test backend
        run: go test -v -race -coverprofile=coverage.txt ./...
        working-directory: ./backend

      - name: Test event worker
        run: go test -v -race -tags=event_worker ./cmd/event-worker
        working-directory: ./backend

      - name: Verify installer fresh lifecycle
        run: scripts/tests/install_fresh_lifecycle_test.sh

      - name: Verify installer administrator lifecycle
        run: scripts/tests/install_admin_update_test.sh

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.txt
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true  # Don't fail if codecov is not configured

      # ---- Security Scan ----
      - name: Run Trivy security scan
        # v0.36.0, pinned by commit instead of a mutable branch or tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Separate job for build verification
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build final production image
        run: |
          docker build \
            --build-arg VITE_APP_COMMIT=${GITHUB_SHA} \
            --build-arg VITE_APP_BUILD_TIME=$(date -u +%FT%TZ) \
            --build-arg VCS_REF=${GITHUB_SHA} \
            -t dreamtrans-ci:${GITHUB_SHA} \
            -t ghcr.io/soaringjerry/dreamtrans:ci-${GITHUB_SHA} .
          docker build -t dreamtrans-frontend-ci:${GITHUB_SHA} ./frontend

      - name: Verify final image contents and runtime identity
        run: |
          image="dreamtrans-ci:${GITHUB_SHA}"
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
          test "$configured_user" = "dreamtrans"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "${GITHUB_SHA}"
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            test "$(id -u)" -eq 10001
            test -x /app/server
            test -f /app/public/index.html
            test -f /usr/share/dreamtrans/migrations/001_init.sql
            test -f /usr/share/dreamtrans/migrations/012_repair_seed_pricing_precision.sql
            test -r /usr/share/dreamtrans/migrate.sh
            test "$(stat -c %a /usr/share/dreamtrans/migrations)" = "555"
            test "$(stat -c %a /usr/share/dreamtrans/migrations/001_init.sql)" = "444"
            test "$(stat -c %a /usr/share/dreamtrans/migrate.sh)" = "555"
            test -d /app/data
            test -w /app/data
            test ! -e /app/.env
            test ! -e /app/.env.example
            touch /app/data/.write-test
            rm /app/data/.write-test
          '
          container="dreamtrans-ci-health-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e SM_API_KEY=ci-placeholder \
            -e ALLOW_ANONYMOUS_API=true \
            "$image"
          for attempt in $(seq 1 60); do
            if docker exec "$container" \
              wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

      - name: Verify legacy appdata permission migration
        run: |
          scripts/tests/install_appdata_permissions_test.sh \
            "dreamtrans-ci:${GITHUB_SHA}"

      - name: Verify Compose migrations and readiness
        run: |
          project="dreamtrans-ci-${GITHUB_RUN_ID}"
          export IMAGE_TAG="ci-${GITHUB_SHA}"
          export BIND_ADDRESS="127.0.0.1"
          export PORT="18085"
          export SM_API_KEY="ci-placeholder"
          export POSTGRES_PASSWORD="ci-postgres-${GITHUB_RUN_ID}"
          export JWT_SECRET="0123456789abcdef0123456789abcdef"
          export JWT_REFRESH_SECRET="fedcba9876543210fedcba9876543210"
          export ALLOW_ANONYMOUS_API="true"
          trap 'docker compose -p "$project" down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose -p "$project" config --quiet
          docker compose -p "$project" up -d
          for attempt in $(seq 1 60); do
            container="$(docker compose -p "$project" ps -q dreamtrans)"
            state="$(docker inspect \
              --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' \
              "$container" 2>/dev/null || true)"
            if [ "$state" = "running healthy" ]; then
              test "$(docker inspect --format '{{.Config.StopTimeout}}' "$container")" = "30"
              test "$(docker inspect --format '{{.Image}}' "$container")" = \
                "$(docker image inspect --format '{{.Id}}' "ghcr.io/soaringjerry/dreamtrans:${IMAGE_TAG}")"
              exit 0
            fi
            if [ "${state%% *}" = exited ] || [ "${state%% *}" = dead ]; then
              docker compose -p "$project" logs --tail=100
              exit 1
            fi
            sleep 2
          done
          docker compose -p "$project" logs --tail=100
          exit 1

      - name: Verify standalone frontend runtime
        run: |
          image="dreamtrans-frontend-ci:${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "node"
          test "$(docker run --rm --entrypoint serve "$image" --version)" = "14.2.6"
          container="dreamtrans-frontend-ci-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" "$image"
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$health" = healthy ]; then
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/ | grep -q 'id="root"'
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/pro | grep -q 'id="pro-root"'
              docker exec "$container" wget -q -O - \
                http://127.0.0.1:3000/pro/admin | grep -q 'id="pro-admin-root"'
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
