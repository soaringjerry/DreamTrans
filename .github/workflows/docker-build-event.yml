name: Build and Push Event Worker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker-build-event.yml'
      - '.dockerignore'
      - 'backend/Dockerfile.event'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/cmd/event-worker/**'
      - 'backend/internal/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dreamtrans

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        # setup-qemu-action v3, pinned to an immutable commit.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (retry)
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@v2
        with:
          max_attempts: 5
          retry_wait_seconds: 10
          timeout_minutes: 2
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-event
          # Version-tag publications must not race or roll back main's latest.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (event-worker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.event
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=dreamtrans-event
            type=gha
          cache-to: type=gha,mode=max,scope=dreamtrans-event
          platforms: linux/amd64,linux/arm64

      - name: Generate deployment instructions
        if: github.event_name != 'pull_request'
        run: |
          echo "## Event Worker Deployment Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Event Worker Docker image has been built and pushed to GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-event:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run the container (remote PCAS uses TLS by default):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run --rm \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e SM_API_KEY=your_speechmatics_api_key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_ADDR=pcas.example.com:50051 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_API_KEY=your_independent_pcas_service_key \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e PCAS_CA_CERT=/run/secrets/pcas-ca.crt \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v /host/path/pcas-ca.crt:/run/secrets/pcas-ca.crt:ro \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-event:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
